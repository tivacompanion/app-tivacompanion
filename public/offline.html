<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tiva — Offline</title>
  <meta name="theme-color" content="#0A0F0D" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: #0A0F0D;
      color: #fff;
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      padding-bottom: env(safe-area-inset-bottom, 2rem);
      padding-top: env(safe-area-inset-top, 2rem);
    }

    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 2rem;
      padding: 2.5rem 2rem;
      max-width: 380px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .logo {
      width: 72px;
      height: 72px;
      background: rgba(64,201,162,0.15);
      border-radius: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      animation: pulse 2s ease-in-out infinite;
    }

    .logo span {
      font-size: 2rem;
      font-weight: 800;
      color: #40C9A2;
      font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(64,201,162,0.3); }
      50%        { box-shadow: 0 0 0 12px rgba(64,201,162,0); }
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #fff;
      font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
    }

    p {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.6);
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(64,201,162,0.12);
      color: #40C9A2;
      border: 1px solid rgba(64,201,162,0.25);
      border-radius: 999px;
      padding: 0.35rem 0.85rem;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #ef4444;
      animation: blink 1.2s step-start infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #40C9A2;
      color: #0A0F0D;
      border: none;
      border-radius: 999px;
      padding: 0.85rem 2rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s, transform 0.15s;
      font-family: inherit;
    }
    button:hover   { opacity: 0.9; }
    button:active  { transform: scale(0.97); }

    .tip {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.35);
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;600;700&display=swap">
</head>
<body>
  <div class="card">
    <div class="logo"><span>T</span></div>

    <div class="badge">
      <span class="dot"></span>
      No Internet Connection
    </div>

    <h1>You're Offline</h1>
    <p>
      Tiva can't reach the server right now. Please check your network connection and try again.
      Emergency contacts and cached health data are still available.
    </p>

    <button onclick="location.reload()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
      Try Again
    </button>

    <p class="tip">💊 Medication reminders are stored locally and will continue to work offline.</p>
  </div>

  <script>
    // Auto-reload when connection is restored
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
